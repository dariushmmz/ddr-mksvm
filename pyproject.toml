[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddr-mksvm"
version = "1.0.0"
description = "Audited nonlinear SVM experiments for imbalanced classification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Research code; see repository documentation"}
authors = [{name = "DDR-MKSVM research team"}]
dependencies = [
  "numpy>=1.24,<2.0",
  "scipy>=1.10",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "joblib>=1.2",
  "cvxpy>=1.6.5,<1.7",
]

[project.optional-dependencies]
deep = ["torch>=2.1"]
dev = ["pytest>=7.4"]
paper = [
  "matplotlib>=3.7",
  "python-docx>=1.1",
  "pypdf>=4.0",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
ddr-mksvm = "ddr_mksvm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ddr_mksvm*"]
exclude = ["archive*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
